services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: inrsettle_sandbox
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run pnpm sandbox:configure first}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - sandbox-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inrsettle_sandbox"]
      interval: 2s
      timeout: 2s
      retries: 20
volumes:
  sandbox-postgres:
